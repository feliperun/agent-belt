name: quality

on:
  push:
    branches: [main]
  pull_request:

# Reads the history to find the merge base; writes nothing.
permissions:
  contents: read

# Structural gate only: building and testing need AppKit and run on macOS in ci.yml.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit: a tag can be moved onto other code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # gate needs the merge base
          persist-credentials: false

      - name: Install Sentrux
        env:
          SENTRUX_VERSION: v0.5.7
          # The gate binary runs over the whole checkout: verify it is the
          # release we pinned, not whatever the download returns today.
          SENTRUX_SHA256: 3237f80fe20d54aad4deefa8a143f0d60543bb5d2d6ad891eb42432f155725a6
        run: |
          mkdir -p "$HOME/.sentrux/bin"
          curl -fsSL --proto '=https' --proto-redir '=https' \
            "https://github.com/sentrux/sentrux/releases/download/${SENTRUX_VERSION}/sentrux-linux-x86_64" \
            -o "$HOME/.sentrux/bin/sentrux"
          echo "$SENTRUX_SHA256  $HOME/.sentrux/bin/sentrux" | sha256sum --check --strict -
          chmod +x "$HOME/.sentrux/bin/sentrux"
          echo "$HOME/.sentrux/bin" >> "$GITHUB_PATH"

      - name: Sentrux check (absolute rules)
        run: sentrux check .

      - name: Sentrux gate (no regression)
        if: github.event_name == 'pull_request'
        run: sentrux gate .
