name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseSafe
      - run: zig build test
      - run: bash -n install.sh && bash -n scripts/update.sh && bash -n work/bin/work && bash -n work/bin/work-session
