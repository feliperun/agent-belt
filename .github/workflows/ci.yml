name: ci
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      # Actions are pinned by commit: a tag can be moved onto other code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseSafe
      - run: zig build test
      - run: bash -n install.sh && bash -n scripts/update.sh && bash -n scripts/mesh-keys.sh
      # agb is the session CLI on Linux and Windows too: keep those builds green.
      - run: zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe --prefix zig-out/linux
      - run: zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSafe --prefix zig-out/linux-arm
      - run: zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe --prefix zig-out/windows
